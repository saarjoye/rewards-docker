version: "3.8"

services:
  rewards-v3:
    image: ghcr.io/saarjoye/rewards-docker:latest
    container_name: rewards
    restart: unless-stopped
    shm_size: 1gb
    mem_limit: 512m
    ports:
      - "5308:5308"
    environment:
      - TZ=Asia/Shanghai
      - PORT=5308
      - DATA_DIR=/app/data
    volumes:
      - /docker/home/rewards-v3:/app/data
