name: microsoft-rewards-v4

services:
    rewards-core:
        image: mrs-core:4.3.2-d0f07d7
        build:
            context: .
            dockerfile: Dockerfile
        container_name: microsoft-rewards-core
        restart: unless-stopped
        env_file:
            - ./runtime/core.env
        environment:
            API_MODE: 'true'
            API_HOST: '0.0.0.0'
            API_PORT: '3010'
            RUN_ON_START: 'false'
            API_ALLOW_ENV_OVERRIDES: 'false'
            API_ALLOW_CONFIG_REVEAL: 'false'
            API_ALLOW_CONFIG_WRITE: 'false'
            API_ALLOW_SCHEDULE_WRITE: 'false'
            CONFIG_SEARCH_QUERY_ENGINES: 'local'
            CONFIG_SEARCH_ON_BING_LOCAL: 'true'
            CONFIG_PROXY_QUERY_ENGINE: 'false'
            CONFIG_EXPERIMENTAL_API_SEARCH: 'false'
            CONFIG_EXPERIMENTAL_API_SEARCH_ON_BING: 'false'
        expose:
            - '3010'
        volumes:
            - ./config-v4:/usr/src/microsoft-rewards-script/config
            - ./sessions-v4:/usr/src/microsoft-rewards-script/sessions
        healthcheck:
            test: ['CMD-SHELL', 'scripts/docker/healthcheck.sh']
            interval: 60s
            timeout: 5s
            retries: 3
            start_period: 30s
        security_opt:
            - no-new-privileges:true
        networks:
            - rewards-control

    rewards-web:
        image: mrs-web:4.3.2-cn1
        build:
            context: ./web
            dockerfile: Dockerfile
        container_name: microsoft-rewards-web
        restart: unless-stopped
        env_file:
            - ./runtime/web.env
        environment:
            TZ: ${TZ:-Asia/Shanghai}
            WEB_HOST: '0.0.0.0'
            WEB_PORT: '3000'
            WEB_DATA_DIR: '/app/data'
            CONTROL_API_URL: 'http://rewards-core:3010'
        ports:
            - '${WEB_PORT:-8787}:3000'
        volumes:
            - ./web-data:/app/data
        depends_on:
            - rewards-core
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "require('http').get('http://127.0.0.1:3000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        read_only: true
        tmpfs:
            - /tmp
        security_opt:
            - no-new-privileges:true
        networks:
            - rewards-control

networks:
    rewards-control:
        driver: bridge
