name: Build versioned images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: false

env:
  CORE_IMAGE: ghcr.io/${{ github.repository_owner }}/mrs-core
  CORE_TAG: 5.0.0-next.3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify Next offline
        run: |
          npm run check
          npm run lint
          npm test -- --reporter=dot
          npm run build
          docker compose config --quiet
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build pinned browser layer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.browser
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.CORE_IMAGE }}:browser-patchright-1.61.1
          cache-from: type=gha,scope=next-browser
          cache-to: type=gha,mode=max,scope=next-browser
      - name: Build candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            BROWSER_IMAGE=${{ env.CORE_IMAGE }}:browser-patchright-1.61.1
          tags: ${{ env.CORE_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Microsoft Rewards Next
          cache-from: type=gha,scope=next-app
          cache-to: type=gha,mode=max,scope=next-app
      - name: Verify candidate with empty synthetic data
        env:
          CANDIDATE: ${{ env.CORE_IMAGE }}:sha-${{ github.sha }}
        run: |
          docker run --detach --name next-smoke --network none "$CANDIDATE"
          trap 'docker rm -f next-smoke >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if docker exec next-smoke node -e "require('http').get('http://127.0.0.1:3000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Promote verified candidate
        run: |
          docker buildx imagetools create \
            --tag "$CORE_IMAGE:$CORE_TAG" \
            --tag "$CORE_IMAGE:latest" \
            "$CORE_IMAGE:sha-${{ github.sha }}"
