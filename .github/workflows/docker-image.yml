name: Build versioned images

on:
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: docker-images-${{ github.ref }}
    cancel-in-progress: true

env:
    CORE_IMAGE: ghcr.io/${{ github.repository_owner }}/mrs-core
    CORE_TAG: 4.3.2-cn2
    WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/mrs-web
    WEB_TAG: 4.3.2-cn2

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Validate Compose configuration
              run: |
                  sudo install -d -m 700 /home/docker/rewards/runtime /home/docker/rewards/secrets
                  sudo cp runtime/core.env.example /home/docker/rewards/runtime/core.env
                  sudo cp runtime/web.env.example /home/docker/rewards/runtime/web.env
                  head -c 32 /dev/zero | sudo tee /home/docker/rewards/secrets/core_accounts.key >/dev/null
                  head -c 32 /dev/zero | sudo tee /home/docker/rewards/secrets/web_settings.key >/dev/null
                  sudo docker compose config --quiet

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push core
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  platforms: linux/amd64,linux/arm64
                  cache-from: type=gha,scope=mrs-core
                  cache-to: type=gha,mode=max,scope=mrs-core
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.description=Microsoft Rewards Script v4.3.2 core
                  tags: ${{ env.CORE_IMAGE }}:${{ env.CORE_TAG }}

            - name: Build and push Chinese Web
              uses: docker/build-push-action@v6
              with:
                  context: ./web
                  push: true
                  platforms: linux/amd64,linux/arm64
                  cache-from: type=gha,scope=mrs-web
                  cache-to: type=gha,mode=max,scope=mrs-web
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.description=Microsoft Rewards Chinese control Web
                  tags: ${{ env.WEB_IMAGE }}:${{ env.WEB_TAG }}
