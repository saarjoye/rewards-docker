<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rewards自动任务系统</title>
  <style>
    :root {
      --bg: #eceff2;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --sub: #64748b;
      --primary: #ff5722;
      --primary-hover: #f4511e;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 36px 32px;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .brand-logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #ff5722, #ff784e);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #fff;
      box-shadow: 0 4px 12px rgba(255, 87, 34, 0.3);
    }
    h1 {
      font-size: 20px;
      font-weight: 750;
      letter-spacing: -0.5px;
    }
    .brand-dot { color: var(--primary); }
    .subtitle {
      color: var(--sub);
      font-size: 13px;
      margin: 6px 0 24px;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }
    input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(255, 87, 34, 0.15);
    }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 87, 34, 0.3);
      transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: var(--primary-hover); transform: translateY(-1px); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .message {
      margin-top: 14px;
      font-size: 12px;
      min-height: 18px;
      text-align: center;
      line-height: 1.5;
    }
    .message.error { color: var(--danger); font-weight: 600; }
    .message.ok { color: var(--success); font-weight: 600; }
    .hint {
      margin-top: 20px;
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      line-height: 1.5;
      border-top: 1px solid #f1f5f9;
      padding-top: 14px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="brand-logo">🎁</div>
      <h1>Rewards自动任务系统</h1>
    </div>
    <p class="subtitle hidden" id="page-subtitle" style="display:none;"></p>

    <form id="auth-form" class="hidden" autocomplete="off">
      <div class="form-group">
        <label for="username">管理员账号</label>
        <input id="username" name="username" type="text" autocomplete="username" minlength="3" maxlength="64" placeholder="输入管理员用户名" required>
      </div>
      <div class="form-group" id="password-field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" maxlength="128" placeholder="输入登录密码" required>
      </div>
      <div class="form-group hidden" id="confirm-field">
        <label for="confirm-password">确认密码</label>
        <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" maxlength="128" placeholder="再次输入密码确认">
      </div>
      <button id="submit-btn" type="submit">登录系统</button>
    </form>

    <div id="message" class="message"></div>
    <p class="hint" id="hint">未经验证的人员无法查看控制台及任何账号信息</p>
  </div>

  <script>
    (function () {
      var form = document.getElementById('auth-form');
      var subtitleEl = document.getElementById('page-subtitle');
      var messageEl = document.getElementById('message');
      var hintEl = document.getElementById('hint');
      var submitBtn = document.getElementById('submit-btn');
      var confirmField = document.getElementById('confirm-field');
      var confirmInput = document.getElementById('confirm-password');
      var passwordInput = document.getElementById('password');
      var initialized = false;

      function setMessage(text, kind) {
        messageEl.textContent = text || '';
        messageEl.className = 'message' + (kind ? ' ' + kind : '');
      }

      function setBusy(busy) {
        submitBtn.disabled = busy;
        submitBtn.textContent = busy ? '请稍候...' : (initialized ? '进入控制台' : '创建管理员并登录');
      }

      function showSetupMode() {
        initialized = false;
        subtitleEl.textContent = ''; subtitleEl.style.display = 'none';
        hintEl.textContent = '账号长度 3-64 位；密码至少 6 位，用于保护控制台安全。';
        confirmField.classList.remove('hidden');
        confirmInput.required = true;
        submitBtn.textContent = '创建管理员并登录';
        form.classList.remove('hidden');
      }

      function showLoginMode(username) {
        initialized = true;
        subtitleEl.textContent = ''; subtitleEl.style.display = 'none';
        hintEl.textContent = '会话采用安全 HttpOnly 加密签名，有效期 7 天。';
        confirmField.classList.add('hidden');
        confirmInput.required = false;
        submitBtn.textContent = '登录进入控制台';
        form.classList.remove('hidden');
      }

      async function fetchStatus() {
        var res = await fetch('/api/auth/status', { credentials: 'same-origin' });
        return await res.json();
      }

      fetchStatus().then(function (res) {
        if (res.authenticated) {
          window.location.replace('/');
          return;
        }
        if (res.initialized) showLoginMode(res.username);
        else showSetupMode();
      }).catch(function () {
        subtitleEl.textContent = '无法连接服务，请刷新页面重试。';
      });

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        setMessage('');
        var username = document.getElementById('username').value.trim();
        var password = passwordInput.value;
        var confirmPassword = confirmInput.value;
        if (!initialized && password !== confirmPassword) {
          setMessage('两次输入的密码不一致', 'error');
          return;
        }
        setBusy(true);
        try {
          var endpoint = initialized ? '/api/auth/login' : '/api/auth/setup';
          var body = initialized ? { username: username, password: password } : { username: username, password: password, confirmPassword: confirmPassword };
          var res = await fetch(endpoint, {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          var data = await res.json().catch(function () { return {}; });
          if (!res.ok || !data.success) throw new Error(data.message || '登录失败');
          setMessage('验证通过，正在进入控制台...', 'ok');
          window.location.replace('/');
        } catch (e) {
          setMessage(e.message, 'error');
          setBusy(false);
        }
      });
    })();
  </script>
</body>
</html>
